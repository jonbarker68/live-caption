# Vocabulary paths are relative to this configuration file. CLI --vocabulary overrides.
vocabulary_file: vocabulary.yaml

# Caption settings use live_caption.config's shared schema.
# Merge this section into existing audio, Speechmatics and layout settings.
processing:
  profanity:
    mode: omit  # omit (default) or off (show ASR text verbatim)
    additional_words: []  # extra whole words or phrases, case-insensitive
    allow_words: []  # exceptions, including terms tagged by Speechmatics

overlay:
  layout: bbc_live
  alignment: left
  scroll_duration_ms: 180
bbc:
  pause_threshold_seconds: 2.0  # 0 disables a fresh line after a pause
  lines: 2
  line_width: 36

# Recognition is off by default; enable for events with panel discussions.
speechmatics:
  diarization: none  # speaker to enable; CLI --diarization overrides
  speaker_diarization_config:
    prefer_current_speaker: true
speakers:
  mode: white  # white or speakers; CLI --speaker-colours overrides
  colours: ["#FFFFFF", "#FFE066", "#77DDF5", "#FFB3D9", "#A9E88B"]
  unknown_colour: "#FFFFFF"
