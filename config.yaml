speechmatics:
  model: enhanced
  language: en
  max_delay: 0.7
  enable_partials: true

processing:
  profanity_filter: false
  profanity_replacement: "*"

overlay:
  # Caption-flow strategy: rolling | bbc
  layout: bbc

  # "overlay" = floating caption panel over other applications
  # "window"  = fill the entire visible screen with the caption display
  mode: overlay

  # Geometry used in overlay mode
  width_fraction: 0.82
  max_width: 1200
  height: 170
  bottom_margin: 45
  position: bottom # bottom | center | top

  # Caption text
  font_family: system
  font_size: 30
  font_weight: semibold # regular | medium | semibold | bold
  font_color: "#ffffff"
  alignment: left # left | center | right
  padding: 18

  # Background
  background_color: "#000000"
  background_opacity: 0.76
  shadow: true

  # Used by layout: rolling
  max_context_chars: 180

  # Used by layout: bbc
  bbc:
    lines: 2
    line_width: 36
